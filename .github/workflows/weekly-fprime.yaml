name: Weekly F Prime devel

# Confirms STARS still works against the latest F Prime once a week.
on:
    schedule:
        - cron: '0 8 * * 1'  # Mondays 08:00 UTC
    workflow_dispatch:
        inputs:
            fprime-ref:
                description: nasa/fprime git ref to test against
                type: string
                required: false
                default: devel

jobs:
    test:
        name: Test
        uses: ./.github/workflows/test.yaml
        with:
            fprime-ref: ${{ inputs.fprime-ref || 'devel' }}
